<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IEEE E&TC - Spectrum Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0e17;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #00e5ff;
            padding: 10px;
        }
        .game-wrapper {
            background: #111927;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #2a4055;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
            max-width: 820px;
        }
        .canvas-container {
            text-align: center;
            width: 100%;
        }
        canvas {
            background: #0d1420;
            border-radius: 12px;
            border: 2px solid #1e3347;
            display: block;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            touch-action: none;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 16px;
            letter-spacing: 1px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .status-bar span {
            background: #1a2533;
            padding: 4px 14px;
            border-radius: 30px;
            border-left: 3px solid #00e5ff;
            font-size: 14px;
        }
        .leaderboard {
            background: #0f1822;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid #1e3347;
            width: 100%;
            max-width: 400px;
        }
        .leaderboard h3 {
            text-align: center;
            color: #ffb347;
            border-bottom: 1px solid #2a4055;
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-size: 18px;
        }
        .leaderboard ul {
            list-style: none;
        }
        .leaderboard li {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px dashed #1a2533;
            font-size: 13px;
        }
        .leaderboard .rank {
            color: #8899aa;
            margin-right: 10px;
        }
        .leaderboard .score {
            color: #ffd700;
        }
        .btn {
            background: #00e5ff;
            border: none;
            color: #0a0e17;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            font-family: 'Courier New', monospace;
            touch-action: manipulation;
        }
        .btn:hover {
            background: #ffb347;
            box-shadow: 0 0 20px #ffb34750;
            transform: scale(1.02);
        }
        .hint {
            font-size: 12px;
            color: #5a7a8a;
            margin-top: 10px;
            text-align: center;
        }
        #gameOverMsg {
            color: #ff4d6d;
            font-weight: bold;
            margin-top: 8px;
            min-height: 24px;
            font-size: 14px;
        }

        @media (min-width: 700px) {
            .game-wrapper {
                flex-direction: row;
                align-items: flex-start;
                padding: 25px;
            }
            .canvas-container {
                flex: 1;
            }
            .leaderboard {
                max-width: 220px;
                min-width: 180px;
            }
        }

        @media (max-width: 500px) {
            .game-wrapper {
                padding: 12px;
                border-radius: 12px;
            }
            .status-bar {
                font-size: 13px;
            }
            .status-bar span {
                font-size: 12px;
                padding: 3px 10px;
            }
            .leaderboard {
                padding: 12px 14px;
            }
            .leaderboard h3 {
                font-size: 16px;
            }
            .leaderboard li {
                font-size: 12px;
            }
            .btn {
                font-size: 16px;
                padding: 8px 20px;
            }
            #gameOverMsg {
                font-size: 12px;
            }
            .hint {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="canvas-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="status-bar">
            <span>📡 Frequency: <span id="freqDisplay">484 THz</span></span>
            <span>🏆 Score: <span id="scoreDisplay">0</span></span>
        </div>
        <div id="gameOverMsg"></div>
        <button class="btn" id="playBtn">▶ PLAY NOW</button>
        <div class="hint">⬆ ⬇ ⬅ ➡  |  Swipe to steer  |  Eat Photons to shift the Spectrum!</div>
    </div>

    <div class="leaderboard">
        <h3>⚡ TOP SIGNALS</h3>
        <ul id="leaderboardList">
            <li><span class="rank">1.</span> <span>IEEE_Photon</span> <span class="score">120</span></li>
            <li><span class="rank">2.</span> <span>WaveRider</span> <span class="score">95</span></li>
            <li><span class="rank">3.</span> <span>OhmBoy</span> <span class="score">70</span></li>
        </ul>
        <p style="font-size:11px; color:#3a5a6a; text-align:center; margin-top:10px;">* Local High Score stored</p>
    </div>
</div>

<script>
    // ============================================================
    // IEEE E&TC - SPECTRUM SNAKE (Full Game Logic)
    // ============================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreDisplay');
    const freqSpan = document.getElementById('freqDisplay');
    const gameOverMsg = document.getElementById('gameOverMsg');
    const playBtn = document.getElementById('playBtn');

    // Grid settings
    const GRID_SIZE = 20;
    const CELL_SIZE = 20;
    const TICK_INTERVAL = 150;

    // Game state
    let snake = [];
    let food = { x: 8, y: 10 };
    let direction = { dx: 1, dy: 0 };
    let nextDirection = { dx: 1, dy: 0 };
    let score = 0;
    let highScore = parseInt(localStorage.getItem('spectrumSnakeHigh')) || 0;
    let gameRunning = false;
    let gameOver = false;
    let gameLoop = null;

    function updateLeaderboardUI() {
        const list = document.getElementById('leaderboardList');
        let items = [
            { name: 'IEEE_Photon', score: 120 },
            { name: 'WaveRider', score: 95 },
            { name: 'OhmBoy', score: 70 }
        ];
        if (highScore > 0) {
            items.push({ name: '🌟 YOU (Local)', score: highScore });
        }
        items.sort((a, b) => b.score - a.score);
        items = items.slice(0, 5);
        list.innerHTML = items.map((item, idx) => 
            `<li><span class="rank">${idx+1}.</span> <span>${item.name}</span> <span class="score">${item.score}</span></li>`
        ).join('');
    }
    updateLeaderboardUI();

    function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateFood() {
        const maxAttempts = 100;
        for (let i = 0; i < maxAttempts; i++) {
            const fx = randomInt(0, GRID_SIZE - 1);
            const fy = randomInt(0, GRID_SIZE - 1);
            if (!snake.some(seg => seg.x === fx && seg.y === fy)) {
                food = { x: fx, y: fy };
                return true;
            }
        }
        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                if (!snake.some(seg => seg.x === x && seg.y === y)) {
                    food = { x, y };
                    return true;
                }
            }
        }
        return false;
    }

    function resetGame() {
        if (gameLoop) {
            clearInterval(gameLoop);
            gameLoop = null;
        }
        snake = [
            { x: 8, y: 10 },
            { x: 7, y: 10 },
            { x: 6, y: 10 },
            { x: 5, y: 10 }
        ];
        direction = { dx: 1, dy: 0 };
        nextDirection = { dx: 1, dy: 0 };
        score = 0;
        gameOver = false;
        gameRunning = true;
        gameOverMsg.innerText = '';
        scoreSpan.innerText = '0';
        freqSpan.innerText = '484 THz';
        generateFood();
        drawGame();
    }

    function endGame() {
        gameRunning = false;
        gameOver = true;
        if (gameLoop) {
            clearInterval(gameLoop);
            gameLoop = null;
        }
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('spectrumSnakeHigh', highScore.toString());
            updateLeaderboardUI();
        }
        gameOverMsg.innerText = '💥 SIGNAL LOST! Press PLAY NOW to retune.';
        drawGame();
    }

    function updateGame() {
        if (!gameRunning || gameOver) return;

        if ((nextDirection.dx !== 0 || nextDirection.dy !== 0) &&
            (direction.dx !== -nextDirection.dx || direction.dy !== -nextDirection.dy)) {
            direction = { ...nextDirection };
        }

        const head = snake[0];
        const newHead = {
            x: head.x + direction.dx,
            y: head.y + direction.dy
        };

        if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
            endGame();
            return;
        }

        const isEating = (newHead.x === food.x && newHead.y === food.y);

        let newSnake = [newHead, ...snake];
        if (!isEating) {
            newSnake.pop();
        }

        const headCollision = newSnake.slice(1).some(seg => seg.x === newHead.x && seg.y === newHead.y);
        if (headCollision) {
            endGame();
            return;
        }

        snake = newSnake;

        if (isEating) {
            score++;
            scoreSpan.innerText = score;
            const freq = Math.min(750, 430 + (score * 10));
            freqSpan.innerText = Math.round(freq) + ' THz';

            if (!generateFood()) {
                gameRunning = false;
                gameOverMsg.innerText = '🏆 YOU DOMINATED THE SPECTRUM! 🏆';
                if (gameLoop) clearInterval(gameLoop);
                drawGame();
                return;
            }
        }

        drawGame();
    }

    function drawGame() {
        ctx.clearRect(0, 0, 400, 400);

        ctx.strokeStyle = '#1a2a3a';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= GRID_SIZE; i++) {
            ctx.beginPath();
            ctx.moveTo(i * CELL_SIZE, 0);
            ctx.lineTo(i * CELL_SIZE, 400);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * CELL_SIZE);
            ctx.lineTo(400, i * CELL_SIZE);
            ctx.stroke();
        }

        // Food
        ctx.shadowColor = '#ffffaa';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(food.x * CELL_SIZE + CELL_SIZE/2, food.y * CELL_SIZE + CELL_SIZE/2, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.shadowBlur = 35;
        ctx.beginPath();
        ctx.arc(food.x * CELL_SIZE + CELL_SIZE/2, food.y * CELL_SIZE + CELL_SIZE/2, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffdd44';
        ctx.fill();
        ctx.shadowBlur = 0;

        // Snake
        const len = snake.length;
        for (let i = 0; i < len; i++) {
            const seg = snake[i];
            const x = seg.x * CELL_SIZE;
            const y = seg.y * CELL_SIZE;
            const hue = (i / len) * 280;
            const sat = i === 0 ? '100%' : '90%';
            const light = i === 0 ? '70%' : '55%';

            ctx.shadowBlur = i === 0 ? 20 : 8;
            ctx.shadowColor = i === 0 ? '#aa88ff' : `hsl(${hue}, 100%, 50%)`;

            ctx.fillStyle = `hsl(${hue}, ${sat}, ${light})`;
            ctx.beginPath();
            ctx.roundRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2, 4);
            ctx.fill();

            if (i === 0) {
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(x + 14, y + 6, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        if (gameOver && !gameRunning) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, 400, 400);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ff4d6d';
            ctx.font = 'bold 24px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('📡 CARRIER LOST', 200, 180);
            ctx.fillStyle = '#8899aa';
            ctx.font = '16px "Courier New", monospace';
            ctx.fillText('Score: ' + score, 200, 230);
        }
    }

    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (r > w/2) r = w/2;
            if (r > h/2) r = h/2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };
    }

    // === Keyboard controls ===
    document.addEventListener('keydown', (e) => {
        const key = e.key;
        if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)) {
            e.preventDefault();
        }

        if (!gameRunning && !gameOver) {
            // If game is idle, we do nothing – the modal handles start.
            return;
        }

        switch (key) {
            case 'ArrowUp':    if (direction.dy !== 1)  nextDirection = { dx: 0, dy: -1 }; break;
            case 'ArrowDown':  if (direction.dy !== -1) nextDirection = { dx: 0, dy: 1 }; break;
            case 'ArrowLeft':  if (direction.dx !== 1)  nextDirection = { dx: -1, dy: 0 }; break;
            case 'ArrowRight': if (direction.dx !== -1) nextDirection = { dx: 1, dy: 0 }; break;
        }
    });

    // === Touch / Swipe controls ===
    let touchStartX = 0;
    let touchStartY = 0;
    let isSwiping = false;

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        isSwiping = true;
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!isSwiping) return;
        const touch = e.touches[0];
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;

        if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;

        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0 && direction.dx !== -1) {
                nextDirection = { dx: 1, dy: 0 };
            } else if (dx < 0 && direction.dx !== 1) {
                nextDirection = { dx: -1, dy: 0 };
            }
        } else {
            if (dy > 0 && direction.dy !== -1) {
                nextDirection = { dx: 0, dy: 1 };
            } else if (dy < 0 && direction.dy !== 1) {
                nextDirection = { dx: 0, dy: -1 };
            }
        }

        isSwiping = false;
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        isSwiping = false;
    }, { passive: false });

    // === Play Button: send message to parent to open modal ===
    playBtn.addEventListener('click', () => {
        // Instead of starting the game directly, tell parent to open modal.
        // The parent will then send a 'startGame' message.
        if (window.parent !== window) {
            window.parent.postMessage('openSnakeModal', '*');
        } else {
            // Fallback if not in iframe (just start directly)
            if (gameLoop) clearInterval(gameLoop);
            resetGame();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, TICK_INTERVAL);
            gameRunning = true;
            gameOver = false;
            gameOverMsg.innerText = '';
        }
    });

    // === Listen for messages from parent ===
    window.addEventListener('message', (e) => {
        if (e.data === 'startGame') {
            // Start the game
            if (gameLoop) clearInterval(gameLoop);
            resetGame();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, TICK_INTERVAL);
            gameRunning = true;
            gameOver = false;
            gameOverMsg.innerText = '';
        } else if (e.data === 'stopGame') {
            // Stop the game and reset to idle state
            if (gameLoop) {
                clearInterval(gameLoop);
                gameLoop = null;
            }
            gameRunning = false;
            gameOver = false;
            // Reset to initial state (draw but not running)
            resetGame();
            gameRunning = false;
            gameOver = false;
            if (gameLoop) {
                clearInterval(gameLoop);
                gameLoop = null;
            }
            drawGame();
            gameOverMsg.innerText = '';
        }
    });

    // === Initial state: game is idle, not running ===
    resetGame();
    gameRunning = false;
    if (gameLoop) {
        clearInterval(gameLoop);
        gameLoop = null;
    }
    drawGame();
    gameOverMsg.innerText = 'Press PLAY NOW to start!';
</script>
</body>
</html>
